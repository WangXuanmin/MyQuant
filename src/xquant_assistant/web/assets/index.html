<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XQuant · 量化交易辅助台</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark">X</span><span>XQuant<small>量化交易辅助台</small></span></a>
    <div class="workspace"><span class="workspace-icon">Q</span><div>我的量化工作区<small>境内 ETF · A 股主板</small></div><span class="chevron">⌄</span></div>
    <div class="nav-label">工作台</div>
    <nav aria-label="主导航">
      <a href="#overview" data-page="overview"><i data-icon="grid"></i>账户概览</a>
      <a href="#candidates" data-page="candidates"><i data-icon="scan"></i>候选与行情</a>
      <a href="#portfolio" data-page="portfolio"><i data-icon="layers"></i>组合与订单</a>
      <a href="#research" data-page="research"><i data-icon="chart"></i>研究与回测</a>
      <a href="#history" data-page="history"><i data-icon="clock"></i>运行记录</a>
      <a href="#settings" data-page="settings"><i data-icon="sliders"></i>策略配置</a>
    </nav>
    <div class="sidebar-note"><span class="green-dot"></span>本地模拟账户<p>资金与订单仅在本机模拟</p></div>
    <div class="sidebar-bottom"><div class="avatar">D</div><div>我的研究空间<small>LOCAL WORKSPACE</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb">工作台<span>/</span><b id="breadcrumb">账户概览</b></div><div class="topbar-right"><span class="local-pill"><span class="green-dot"></span>本地运行</span><span id="header-date"></span><button class="icon-button" id="reload" aria-label="刷新页面数据"><i data-icon="refresh"></i></button></div></header>
    <main id="main" aria-live="polite"><div class="loading">正在读取本地账户与数据…</div></main>
    <footer>新浪原始日线 · 净佣万 0.85 免五 · ETF 滑点 5 bps / A 股 10 bps<span>15% 回撤仅提示，继续模拟成交</span></footer>
  </div>
  <dialog id="operation-dialog"><form id="operation-form"><div class="dialog-title"><div><div class="eyebrow">WORKFLOW</div><h2 id="operation-title"></h2></div><button class="icon-button" type="button" id="close-operation" aria-label="关闭操作窗口">×</button></div><p class="operation-impact" id="operation-impact"></p><div id="operation-fields"></div><div class="dialog-actions"><button class="button secondary" type="button" id="cancel-operation">取消</button><button class="button primary" type="submit">开始执行<i data-icon="arrow"></i></button></div><div id="operation-error" class="form-error" role="alert"></div></form></dialog>
  <aside id="task-panel" class="task-panel" hidden><div class="task-panel-head"><h3>任务进度</h3><button class="icon-button" id="close-task" aria-label="关闭任务面板">×</button></div><div id="task-content"></div></aside>
  <div id="toast" role="status" hidden></div>
</body>
</html>
