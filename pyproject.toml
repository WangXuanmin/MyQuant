[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xquant-assistant"
version = "0.4.0"
description = "Reusable components for the xquant trading assistant"
requires-python = ">=3.12"
dependencies = [
  "akshare>=1.18",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "open-xquant>=0.1.0",
  "tzdata>=2025.1; platform_system == 'Windows'",
]

[project.scripts]
xquant-assistant = "xquant_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xquant_assistant.web" = ["assets/*.html", "assets/*.css", "assets/*.js"]
